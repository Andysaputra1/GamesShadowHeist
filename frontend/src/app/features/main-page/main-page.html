<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

/* Container Utama */
.main-container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background-color: #1a1a1a;
  background-image: 
    linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111), 
    linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111);
  background-size: 20px 20px;
  background-position: 0 0, 10px 10px;
  font-family: 'Press Start 2P', cursive;
  color: #fff;
  padding: 20px;
  box-sizing: border-box;
}

/* Header Kanan Atas */
.top-bar {
  display: flex;
  justify-content: flex-end;
  width: 100%;
}

.user-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  background-color: #2b2b2b;
  padding: 10px 16px;
}

.avatar-box {
  background-color: #000;
  padding: 6px;
  font-size: 16px;
  box-shadow: 
    -2px 0 0 0 #00ffcc, 
    2px 0 0 0 #00ffcc, 
    0 -2px 0 0 #00ffcc, 
    0 2px 0 0 #00ffcc;
}

.username {
  font-size: 12px;
  color: #00ffcc;
}

/* Area Menu Tengah */
.menu-content {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Kotak Pixel Frame */
.pixel-box {
  background-color: #2b2b2b;
  box-shadow: 
    -4px 0 0 0 white, 
    4px 0 0 0 white, 
    0 -4px 0 0 white, 
    0 4px 0 0 white,
    inset -4px 0 0 0 #111,
    inset 0 -4px 0 0 #111;
}

.menu-card {
  padding: 40px;
  text-align: center;
  width: 100%;
  max-width: 480px;
}

.game-title {
  color: #ffcc00;
  font-size: 26px;
  text-shadow: 4px 4px 0px #d32f2f;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 12px;
  color: #a0a0a0;
  margin-bottom: 35px;
}

/* Susunan Tombol */
.menu-buttons {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Tombol Pixel */
.pixel-btn {
  padding: 18px;
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  cursor: pointer;
  border: none;
  transition: transform 0.1s, background-color 0.1s;
  box-shadow: 
    inset -4px -4px 0px 0px rgba(0, 0, 0, 0.4),
    -4px 0 0 0 #fff, 
    4px 0 0 0 #fff, 
    0 -4px 0 0 #fff, 
    0 4px 0 0 #fff;
}

/* Tombol START GAME (Merah) */
.start-btn {
  background-color: #d32f2f;
  color: #fff;
}

.start-btn:hover {
  background-color: #f44336;
}

/* Tombol PROFILE (Biru/Teal) */
.profile-btn {
  background-color: #1976d2;
  color: #fff;
}

.profile-btn:hover {
  background-color: #2196f3;
}

/* Efek Klik Tombol */
.pixel-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 
    inset 4px 4px 0px 0px rgba(0, 0, 0, 0.4),
    -4px 0 0 0 #fff, 
    4px 0 0 0 #fff, 
    0 -4px 0 0 #fff, 
    0 4px 0 0 #fff;
}
</style>

<body>
    <div class="main-container">
  <header class="top-bar">
    <div class="user-badge pixel-box">
      <div class="avatar-box">👾</div>
      <span class="username">{{ username }}</span>
    </div>
  </header>

  <main class="menu-content">
    <div class="pixel-box menu-card">
      <h1 class="game-title">SHADOW HEIST</h1>
      <p class="subtitle">-- MAIN MENU --</p>

      <div class="menu-buttons">
        <button type="button" class="pixel-btn start-btn" routerLink="/lobby">
          ▶ START GAME
        </button>

        <button type="button" class="pixel-btn profile-btn" routerLink="/profile">
          👤 CHARACTER PROFILE
        </button>
      </div>
    </div>
  </main>
</div>

</body>
