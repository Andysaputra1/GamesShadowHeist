version: '3.8'

services:
  # 1. SERVER OLLAMA (LLM LOKAL)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "ollama serve & sleep 10 && ollama pull deepseek-r1:14b && wait",
      ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - shadow-net

  # 2. SERVER PYTHON (NLU + FUZZY + FASTAPI)
  ai-engine:
    build:
      context: ./ai-engine # Pastikan nama foldernya sesuai
      dockerfile: Dockerfile
    container_name: shadow_ai_engine
    ports:
      - "8000:8000"
    environment:
      # Variabel URL agar Python tahu cara nge-hit Ollama di container sebelahnya
      - OLLAMA_URL=http://ollama_server:11434/api/generate 
    depends_on:
      - ollama # Pastikan Ollama jalan duluan sebelum Python
    networks:
      - shadow-net

networks:
  shadow-net:
    driver: bridge

volumes:
  ollama_data: