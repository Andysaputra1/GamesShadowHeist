<style>
    /* Import font Pixel dari Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    /* Wadah Utama (Background) */
    .auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #1a1a1a; /* Latar belakang gelap ala hacker/heist */
    background-image: 
        linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111), 
        linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    font-family: 'Press Start 2P', cursive; /* Terapkan font pixel */
    color: #fff;
    }

    /* Kotak Login Pixel (Shadow Heist Theme) */
    .pixel-box {
    background-color: #2b2b2b;
    padding: 30px;
    text-align: center;
    width: 100%;
    max-width: 450px;
    
    /* Membuat border pixel menggunakan box-shadow */
    box-shadow: 
        -4px 0 0 0 white, 
        4px 0 0 0 white, 
        0 -4px 0 0 white, 
        0 4px 0 0 white,
        inset -4px 0 0 0 #111,
        inset 0 -4px 0 0 #111;
    }

    .game-title {
    color: #ffcc00;
    font-size: 24px;
    text-shadow: 3px 3px 0px #d32f2f;
    margin-bottom: 20px;
    }

    h2 {
    font-size: 16px;
    color: #a0a0a0;
    margin-bottom: 30px;
    }

    .pixel-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
    }

    .input-group {
    text-align: left;
    }

    .input-group label {
    display: block;
    font-size: 10px;
    margin-bottom: 8px;
    color: #00ffcc; /* Neon green/blue accent */
    }

    /* Input text ala retro */
    .input-group input {
    width: 100%;
    padding: 12px;
    background-color: #000;
    color: #fff;
    font-family: 'Press Start 2P', cursive;
    font-size: 12px;
    border: none;
    outline: none;
    box-shadow: 
        inset -4px -4px 0px 0px rgba(255, 255, 255, 0.2),
        inset 4px 4px 0px 0px rgba(0, 0, 0, 0.5),
        -2px 0 0 0 #fff, 
        2px 0 0 0 #fff, 
        0 -2px 0 0 #fff, 
        0 2px 0 0 #fff;
    }

    .input-group input:focus {
    background-color: #111;
    box-shadow: 
        -2px 0 0 0 #00ffcc, 
        2px 0 0 0 #00ffcc, 
        0 -2px 0 0 #00ffcc, 
        0 2px 0 0 #00ffcc;
    }

    /* Tombol ala mesin ding-dong/arcade */
    .pixel-btn {
    margin-top: 10px;
    padding: 15px;
    background-color: #d32f2f;
    color: white;
    font-family: 'Press Start 2P', cursive;
    font-size: 14px;
    cursor: pointer;
    border: none;
    box-shadow: 
        inset -4px -4px 0px 0px rgba(0, 0, 0, 0.4),
        -4px 0 0 0 #fff, 
        4px 0 0 0 #fff, 
        0 -4px 0 0 #fff, 
        0 4px 0 0 #fff;
    transition: transform 0.1s;
    }

    .pixel-btn:hover {
    background-color: #f44336;
    }

    .pixel-btn:active {
    box-shadow: 
        inset 4px 4px 0px 0px rgba(0, 0, 0, 0.4),
        -4px 0 0 0 #fff, 
        4px 0 0 0 #fff, 
        0 -4px 0 0 #fff, 
        0 4px 0 0 #fff;
    transform: translate(2px, 2px);
    }

    .register-text {
    margin-top: 30px;
    font-size: 10px;
    line-height: 1.8;
    color: #888;
    }

    .pixel-link {
    color: #ffcc00;
    text-decoration: none;
    }

    .pixel-link:hover {
    color: #fff;
    }

</style>

<div class="auth-container">
  <div class="pixel-box auth-card " style="height: 100%; ">
    <h1 class="game-title">SHADOW HEIST</h1>
    <h2>LOGIN</h2>
    
    <form class="pixel-form">
      <div class="input-group">
        <label for="username">USERNAME</label>
        <input type="text" id="username" name="username" placeholder="PLAYER_1" required />
      </div>

      <div class="input-group">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" name="password" placeholder="******" required />
      </div>

      <button type="submit" class="pixel-btn" routerLink="/game">START GAME</button>
    </form>
    
    <p class="register-text">
      NO ACCOUNT? <br>
      <a routerLink="/register" class="pixel-link">REGISTER HERE</a>
    </p>
  </div>
</div>
